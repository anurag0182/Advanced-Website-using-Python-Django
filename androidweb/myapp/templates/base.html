<head>
{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AndroidStories{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
   


<style>

.card {
    border-radius: 12px;
}

.btn {
    border-radius: 8px;
}

.navbar {
    font-weight: 500;
}


body {
    font-family: 'Product Sans', 'Google Sans', sans-serif;
}

/* ---------- GLOBAL UI IMPROVEMENTS ---------- */
.card {
    border-radius: 14px;
    overflow: hidden;
    transition: all 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* ---------- LATEST POSTS ---------- */
.latest-card {
    border:#111;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.latest-card img {
    border-radius: 14px 14px 0 0;
}

.latest-card h6 {
    font-weight: 600;
    color: #111;
}

/* ---------- TRENDING SIDEBAR ---------- */
.trending-box {
    background: linear-gradient(135deg, #111, #1c1c1c);
    padding: 15px;
    border-radius: 16px;
    color: #fff;
}

.trending-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 12px;
    transition: 0.3s;
    background: rgba(255,255,255,0.05);
}

.trending-item:hover {
    background: rgba(255,255,255,0.12);
    transform: translateX(5px);
}

.trending-item img {
    border-radius: 10px;
    object-fit: cover;
}

.trending-item a {
    color: #fff;
    text-decoration: none;
}

.trending-item a:hover {
    text-decoration: underline;
}

.slider-img {
    height: 450px;
    object-fit: cover;
}

.animate-caption {
    animation: fadeUp 1s ease-in-out;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    .slider-img {
        height: 250px;
    }
}
</style>


</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    
    <a class="navbar-brand fw-bold" href="/">Sample-Site-Django</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">

      <ul class="navbar-nav me-auto">

        <li class="nav-item">
          <a class="nav-link" href="/category/news/">News</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            Reviews
          </a>

          <div class="dropdown-menu p-4 border-0 shadow" style="min-width: 400px;">
            <div class="row">

              <div class="col-md-6">
                <h6 class="fw-bold">Phones</h6>
                <a class="dropdown-item" href="#">Android</a>
                <a class="dropdown-item" href="#">iPhones</a>
                <a class="dropdown-item" href="#">Flagships</a>
              </div>

              <div class="col-md-6">
                <h6 class="fw-bold">Tech</h6>
                <a class="dropdown-item" href="#">Laptops</a>
                <a class="dropdown-item" href="#">Tablets</a>
                <a class="dropdown-item" href="#">Accessories</a>
              </div>

            </div>
          </div>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/category/guides/">Guides</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/category/deals/">Deals</a>
        </li>

      </ul>

      <!-- Search -->
      <form class="d-flex" method="get" action="/">
        <input class="form-control me-2" type="search" name="q" placeholder="Search...">
        <button class="btn btn-outline-light">Search</button>
      </form>

    </div>
  </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<footer class="bg-dark text-light text-center py-3 mt-5">
    © 2026 Sample by Anurag
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
