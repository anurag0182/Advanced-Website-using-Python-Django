{% extends 'base.html' %}

{% block title %}{{ category.name }} | TechWebPro{% endblock %}

{% block content %}

<h2 class="mb-4">{{ category.name }}</h2>

<div class="row">
    {% for post in posts %}
    <div class="col-md-4">
        <div class="card mb-4 shadow-sm">
            <img src="{{ post.image.url }}" class="card-img-top" style="height:180px; object-fit:cover;">
            <div class="card-body">
                <h6>{{ post.title }}</h6>
                <a href="{% url 'blog_detail' post.slug %}" class="btn btn-sm btn-outline-primary">Read</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
